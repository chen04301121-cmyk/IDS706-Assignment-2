name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check overview.py gold_analysis.py polars_comparison.py tests

      - name: Lint Python code
        run: python -m flake8 overview.py gold_analysis.py polars_comparison.py tests

      - name: Run tests
        run: python -m pytest -v